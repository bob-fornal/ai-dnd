name = "ai-dnd-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── Workers AI ───────────────────────────────────────────────
[ai]
binding = "AI"

# ─── Workers KV (session state) ───────────────────────────────
[[kv_namespaces]]
binding = "SESSION_KV"
id = "" # <-- paste your `wrangler kv:namespace create SESSION_KV` id here
preview_id = "" # <-- paste your `wrangler kv:namespace create SESSION_KV --preview` preview_id here

# ─── D1 Database ──────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "ai-dnd-db"
database_id = "" # <-- paste your `wrangler d1 create ai-dnd-db` database_id here

# ─── Environment Variables ────────────────────────────────────
[vars]
ENVIRONMENT = "development"

# ─── Routes (Cloudflare Pages proxies /api/* here) ────────────
# When deploying standalone, set your route:
# [[routes]]
# pattern = "your-domain.com/api/*"
# zone_name = "your-domain.com"

# ─── Build ────────────────────────────────────────────────────
[build]
command = ""
