name = "ai-dnd-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── Workers AI ───────────────────────────────────────────────
[ai]
binding = "AI"

# ─── Workers KV (session state) ───────────────────────────────
[[kv_namespaces]]
binding = "SESSION_KV"
id = "9a20f79e32c94a46884391abd0a16685"
preview_id = "f76678da70cf4b48a8ef7015e4effc93"

# ─── D1 Database ──────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "ai-dnd-db"
database_id = "3abe5394-613c-4610-a743-94bddc2de838"

# ─── Environment Variables ────────────────────────────────────
[vars]
ENVIRONMENT = "development"

# ─── Routes (Cloudflare Pages proxies /api/* here) ────────────
# When deploying standalone, set your route:
# [[routes]]
# pattern = "your-domain.com/api/*"
# zone_name = "your-domain.com"

# ─── Build ────────────────────────────────────────────────────
[build]
command = ""
